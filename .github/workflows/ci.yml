name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Fails on critical advisories in production deps (the remaining "high" ones
      # come from firebase's pinned @grpc/grpc-js and have no fix yet).
      - run: npm audit --omit=dev --audit-level=critical
